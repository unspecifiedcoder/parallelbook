[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.24"
optimizer = true
optimizer_runs = 20_000
via_ir = false
bytecode_hash = "none"
gas_reports = ["Market", "NaiveBook"]
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  # Vectors.t.sol reads the committed cost vectors and can regenerate them from
  # the contract itself with: forge test --mt test_writeVectors
  { access = "read-write", path = "./test/vectors" },
  { access = "read-write", path = "./test/accesses" },
]

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = false
shrink_run_limit = 5_000

[profile.ci.invariant]
runs = 1_024
depth = 256

[fmt]
line_length = 120
tab_width = 4
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC}"

[etherscan]
monad_testnet = { key = "${MONAD_EXPLORER_API_KEY}", url = "${MONAD_EXPLORER_VERIFY_URL}", chain = 10143 }
